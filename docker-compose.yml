services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    command:
      - "start-dev"
      - "--http-port=9090"
      - "--log-level=INFO,org.keycloak.events:DEBUG"
      - "--import-realm"
      - "--users=realm_file"
    ports:
      - "9090:9090"
      - "9091:9090"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_HOSTNAME_ADMIN_URL=http://localhost:9091
    depends_on:
      - keycloak-db
    restart: unless-stopped
    volumes:
      - ./config/realm.json:/opt/keycloak/data/import/realm.json

  keycloak-db:
    #TODO: ensure the version is the best to simulate our production environment (https://www.keycloak.org/server/db)
    image: postgres:15.3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=keycloak
    volumes:
      - keycloak-db:/var/lib/keycloak-db/data
    restart: unless-stopped

volumes:
  keycloak-db:
