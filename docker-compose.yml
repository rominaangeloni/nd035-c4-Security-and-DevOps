services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    command:
      - "start-dev"
      - "--http-port=9090"
      - "--log-level=INFO,org.keycloak.events:DEBUG"
      - "--import-realm"
      - "--users=realm_file"
    ports:
      - "9090:9090"
      - "9091:9090"
    environment:
      - KEYCLOAK_USER=admin
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=mysql
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KC_DB_URL=jdbc:mysql://keycloak-db:3306/keycloak
      - KC_HOSTNAME_ADMIN_URL=http://localhost:9091
    depends_on:
      - keycloak-db
    restart: unless-stopped
    volumes:
      - ./config/realm.json:/opt/keycloak/data/import/realm.json

  keycloak-db:
    image: mysql:8.3
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_USER=keycloak
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=keycloak
    volumes:
      - keycloak-db:/var/lib/keycloak-db/data
    restart: unless-stopped

volumes:
  keycloak-db:
