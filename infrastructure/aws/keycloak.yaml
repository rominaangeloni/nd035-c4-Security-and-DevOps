Description: "Keycloak service"

Parameters:
  Project:
    Type: String
    Default: iam
    AllowedValues: [ iam ]
  Environment:
    Type: String
    Default: prod
    AllowedValues: [ prod ]
  PrivateHostName:
    Type: String
    Default: private-iam.wallapop.com
    AllowedValues: [ private-iam.wallapop.com ]
  PublicHostName:
    Type: String
    Default: iam.wallapop.com
    AllowedValues: [ iam.wallapop.com ]
  ServiceName:
    Type: String
    Default: iam-keycloak
    AllowedValues: [ iam-keycloak ]
  DockerImageUri:
    Type: String
  ClusterPartition:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Description: ECS cluster partition where this service will run
  ArnCertificate:
    Type: String
    Default: arn:aws:acm:eu-west-1:745640521341:certificate/6086ec3f-b0df-4831-b254-f7b96bf23b93

Mappings:
  Task:
    Memory:
      prod: 2048
    Cpu:
      prod: 1024
    DesiredCapacity:
      prod: 1
    MinCapacity:
      prod: 1
    MaxCapacity:
      prod: 1

Conditions:
  AlarmsEnabled: !Equals [ !Ref Environment, 'prod']

Resources:
  KeycloakAdminUserSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/${ServiceName}/admin"
      Description: Secrets for the Keycloak service
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakDatabaseUserSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/rds/${ServiceName}"
      Description: Secrets for the Keycloak service
      GenerateSecretString:
        SecretStringTemplate: '{"username": "keycloak"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakAuthDatabaseUserSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/rds/auth/${ServiceName}"
      Description: Secrets for Auth RDS Keycloak credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username": "keycloak"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakMonolithDbSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/rds/monolith/${ServiceName}"
      Description: Secrets for the Keycloak service's credentials to connect to Monolith's DB
      GenerateSecretString:
        SecretStringTemplate: '{"username": "keycloak"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakClientSecretSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/${ServiceName}/client-secrets"
      Description: Secrets for the Keycloak's client-secrets
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "portal-hero"
        PasswordLength: 32
        ExcludePunctuation: true

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - KeycloakAdminUserSecrets
      - KeycloakDatabaseUserSecrets
    Properties:
      Family: !Ref ServiceName
      Memory: !FindInMap [ Task, Memory, !Ref Environment ]
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt TaskRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "attribute:cluster-partition == ${ClusterPartition}"
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Ref DockerImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
            - ContainerPort: 9000
          EntryPoint:
              - sh
              - "-c"
              - /opt/keycloak/bin/kc.sh start --import-realm
          Environment:
            - Name: KC_HTTP_PORT
              Value: 8080
            - Name: KC_HOSTNAME
              Value: !Sub "https://${PublicHostName}"
            - Name: KC_PROXY_HEADERS
              Value: xforwarded
            - Name: KC_HTTP_ENABLED
              Value: true
            - Name: KC_LOG
              Value: syslog
            - Name: KC_LOG_LEVEL
              Value: INFO,org.keycloak.events:DEBUG
            - Name: KC_LOG_SYSLOG_OUTPUT
              Value: json
            - Name: KC_LOG_SYSLOG_ENDPOINT
              Value: !Sub "logging-platform-collector.wallapop.${Environment}:5140"
            - Name: KC_HEALTH_ENABLED
              Value: true
            - Name: KC_FEATURES
              Value: persistent-user-sessions
            - Name: KC_DB
              Value: postgres
            - Name: KC_DB_SCHEMA
              Value: keycloak
            - Name: KC_DB_URL
              Value: jdbc:postgresql://iam-keycloak.cluster-chyozymq8sle.eu-west-1.rds.amazonaws.com:5432/keycloak
            - Name: MONOLITH_DB_URL
              Value: jdbc:mysql://monolith-primary.chyozymq8sle.eu-west-1.rds.amazonaws.com:3306/shnmpro2?useUnicode=true&characterEncoding=UTF-8&useFastDateParsing=false&autoReconnect=true&useSSL=false&isReadOnly=true
            - Name: AUTH_DB_URL
              Value: jdbc:mysql://auth-primary.chyozymq8sle.eu-west-1.rds.amazonaws.com:3306/auth?useUnicode=true&characterEncoding=UTF-8&useFastDateParsing=false&autoReconnect=true&useSSL=false&isReadOnly=true
          Secrets:
            - Name: KEYCLOAK_ADMIN
              ValueFrom: !Join [ ':', [ !Ref KeycloakAdminUserSecrets, 'username::' ]]
            - Name: KEYCLOAK_ADMIN_PASSWORD
              ValueFrom: !Join [ ':', [ !Ref KeycloakAdminUserSecrets, 'password::' ]]
            - Name: KC_DB_USERNAME
              ValueFrom: !Join [ ':', [ !Ref KeycloakDatabaseUserSecrets, 'username::' ]]
            - Name: KC_DB_PASSWORD
              ValueFrom: !Join [ ':', [ !Ref KeycloakDatabaseUserSecrets, 'password::' ]]
            - Name: MONOLITH_DB_USERNAME
              ValueFrom: !Join [ ':', [ !Ref KeycloakMonolithDbSecrets, 'username::' ] ]
            - Name: MONOLITH_DB_PASSWORD
              ValueFrom: !Join [ ':', [ !Ref KeycloakMonolithDbSecrets, 'password::' ] ]
            - Name: AUTH_DB_USERNAME
              ValueFrom: !Join [ ':', [ !Ref KeycloakAuthDatabaseUserSecrets, 'username::' ] ]
            - Name: AUTH_DB_PASSWORD
              ValueFrom: !Join [ ':', [ !Ref KeycloakAuthDatabaseUserSecrets, 'password::' ] ]
            - Name: PORTAL_HERO_SECRET
              ValueFrom: !Join [ ':', [ !Ref KeycloakClientSecretSecrets, 'portal-hero::' ] ]
          Cpu: !FindInMap [ Task, Cpu, !Ref Environment ]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/boundary/wallapop-boundaries
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref TaskPolicy
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ServiceName}-task-policy"
      Description: !Sub "Task policy for ${ServiceName} task role"
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - secretsmanager:GetSecretValue
            Effect: Allow
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${Environment}/${Project}/*"
          - Action:
              - kms:Decrypt
            Effect: Allow
            Resource: '*'

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - ListenerHTTPS
      - PublicListenerHTTPS
    Properties:
      Cluster: !Ref Environment
      ServiceName: !Ref ServiceName
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !FindInMap [ Task, DesiredCapacity, !Ref Environment ]
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets:
            - Fn::ImportValue: !Sub "${Environment}-private-subnet-a"
            - Fn::ImportValue: !Sub "${Environment}-private-subnet-b"
            - Fn::ImportValue: !Sub "${Environment}-private-subnet-c"
      LoadBalancers:
        - ContainerName: !Ref ServiceName
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
        - ContainerName: !Ref ServiceName
          ContainerPort: 8080
          TargetGroupArn: !Ref PublicTargetGroup
      PropagateTags: TASK_DEFINITION

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ServiceName}-service-security-group"
      GroupDescription: !Ref ServiceName
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-vpc"
      SecurityGroupIngress:
        - FromPort: 8080
          IpProtocol: tcp
          SourceSecurityGroupId:
            Fn::ImportValue:
              !Sub ecs-${Environment}-clusterALB-SG
          ToPort: 8080
          Description: 'Allow access from ALB'
        - FromPort: 9000
          IpProtocol: tcp
          SourceSecurityGroupId:
            Fn::ImportValue:
              !Sub ecs-${Environment}-clusterALB-SG
          ToPort: 9000
          Description: 'Allow access from ALB to healthcheck port'
        - FromPort: 8080
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref PublicLoadBalancerSecurityGroup
          ToPort: 8080
          Description: 'Allow access from public Security Group'
        - FromPort: 9000
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref PublicLoadBalancerSecurityGroup
          ToPort: 9000
          Description: 'Allow access from public Security Group to healthcheck port'

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref ServiceName
      Scheme: internal
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "true"
      SecurityGroups:
        - Fn::ImportValue:
            !Sub "ecs-${Environment}-clusterALB-SG"
      Subnets:
        - Fn::ImportValue:
            !Sub "${Environment}-private-subnet-a"
        - Fn::ImportValue:
            !Sub "${Environment}-private-subnet-b"
        - Fn::ImportValue:
            !Sub "${Environment}-private-subnet-c"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: LoadBalancer
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub "${Environment}-vpc"
      Port: 8080
      Protocol: HTTP
      Matcher:
        HttpCode: '200-299'
      HealthCheckPort: '9000'
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: '/health'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 10
      TargetType: ip
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
        - Key: slow_start.duration_seconds
          Value: '60'

  ListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ArnCertificate

  DnsAlias:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub "${Environment}-public-hosted-zone"
      RecordSets:
        - Name: !Sub "${PrivateHostName}."
          Type: A
          AliasTarget:
            HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
            DNSName: !GetAtt LoadBalancer.DNSName

  PublicLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ServiceName}-public-alb-security-group"
      GroupDescription: !Sub "Security group for ${ServiceName} public ALB"
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-vpc"
      SecurityGroupIngress:
        - FromPort: 443
          IpProtocol: tcp
          CidrIp: 0.0.0.0/0
          ToPort: 443
          Description: Allows all traffic from internet

  PublicLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ServiceName}-public-alb"
      Scheme: internet-facing
      SecurityGroups:
        - !Ref PublicLoadBalancerSecurityGroup
      Subnets:
        - Fn::ImportValue:
            !Sub "${Environment}-public-subnet-a"
        - Fn::ImportValue:
            !Sub "${Environment}-public-subnet-b"
        - Fn::ImportValue:
            !Sub "${Environment}-public-subnet-c"

  PublicTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: PublicLoadBalancer
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub "${Environment}-vpc"
      Port: 8080
      Protocol: HTTP
      Matcher:
        HttpCode: '200-299'
      HealthCheckPort: '9000'
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: '/health'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 10
      TargetType: ip
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
        - Key: slow_start.duration_seconds
          Value: '60'

  PublicListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PublicTargetGroup
      LoadBalancerArn: !Ref PublicLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ArnCertificate

  PublicDnsAlias:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub "${Environment}-public-hosted-zone"
      RecordSets:
        - Name: !Sub "${PublicHostName}."
          Type: A
          AliasTarget:
            HostedZoneId: !GetAtt PublicLoadBalancer.CanonicalHostedZoneID
            DNSName: !GetAtt PublicLoadBalancer.DNSName

  PublicAlbUnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub "${ServiceName}-${Environment}_unhealthy-host"
      AlarmDescription: !Sub "${ServiceName} - at leas one unhealthy host has been detected"
      ActionsEnabled: true
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref PublicLoadBalancer
        - Name: TargetGroup
          Value: !Ref PublicTargetGroup
      Statistic: Maximum
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      Period: 60
      EvaluationPeriods: 1

  PublicAlb5xxRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub "${ServiceName}-${Environment}_5xx-rate-too-high-on-public-alb"
      AlarmDescription: !Sub "${ServiceName} - too high 5xx rate detected on the public ALB"
      ActionsEnabled: true
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      Metrics:
        - Id: requests
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
            Period: 60
            Stat: Sum
          ReturnData: False
        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
            Period: 60
            Stat: Sum
          ReturnData: False
        - Id: errorRate
          Expression: errors / requests
          Label: 5xxErrorRate
          ReturnData: true
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0.1
      EvaluationPeriods: 5

  KeycloakDatabaseSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ServiceName}-database-security-group-${Environment}"
      SourceSecurityGroupId: !Ref SecurityGroup
      FromPort: 5432
      ToPort: 5432
      IpProtocol: tcp
      Description: Allows Keycloak service to access the database

  MonolithDatabaseSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${Environment}-monolith-sg"
      SourceSecurityGroupId: !Ref SecurityGroup
      FromPort: 3306
      ToPort: 3306
      IpProtocol: tcp
      Description: !Sub "Allow access from ${ServiceName}"

  AuthDatabaseSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "Auth-${Environment}-RDS-sg"
      SourceSecurityGroupId: !Ref SecurityGroup
      FromPort: 3306
      ToPort: 3306
      IpProtocol: tcp
      Description: !Sub "Allow access from ${ServiceName}"
