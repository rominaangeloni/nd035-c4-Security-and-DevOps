Description: "Keycloak service"

Parameters:
  Project:
    Type: String
    Default: iam
    AllowedValues: [ iam ]
  Environment:
    Type: String
    Default: prod
    AllowedValues: [ prod ]
  PrivateHostName:
    Type: String
    Default: private-iam.wallapop.com
    AllowedValues: [ private-iam.wallapop.com ]
  PublicHostName:
    Type: String
    Default: iam.wallapop.com
    AllowedValues: [ iam.wallapop.com ]
  ServiceName:
    Type: String
    Default: iam-keycloak
    AllowedValues: [ iam-keycloak ]
  DockerImageUri:
    Type: String
  ClusterPartition:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Description: ECS cluster partition where this service will run
  ArnCertificate:
    Type: String
    Default: arn:aws:acm:eu-west-1:745640521341:certificate/6086ec3f-b0df-4831-b254-f7b96bf23b93

Mappings:
  Task:
    Memory:
      prod: 2048
    Cpu:
      prod: 1024
    DesiredCapacity:
      prod: 1
    MinCapacity:
      prod: 1
    MaxCapacity:
      prod: 1

Resources:
  KeycloakAdminUserSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/${ServiceName}/admin"
      Description: Secrets for the Keycloak service
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakDatabaseUserSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/rds/${ServiceName}"
      Description: Secrets for the Keycloak service
      GenerateSecretString:
        SecretStringTemplate: '{"username": "keycloak"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakMonolithDbSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/rds/monolith/${ServiceName}"
      Description: Secrets for the Keycloak service's credentials to connect to Monolith's DB
      GenerateSecretString:
        SecretStringTemplate: '{"username": "keycloak"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - KeycloakAdminUserSecrets
      - KeycloakDatabaseUserSecrets
    Properties:
      Family: !Ref ServiceName
      Memory: !FindInMap [ Task, Memory, !Ref Environment ]
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt TaskRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "attribute:cluster-partition == ${ClusterPartition}"
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Ref DockerImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
          EntryPoint:
              - sh
              - "-c"
              - /opt/keycloak/bin/kc.sh start
          Environment:
            - Name: KC_HTTP_PORT
              Value: 8080
            - Name: KC_HOSTNAME
              Value: !Sub "${PublicHostName}"
            - Name: KC_HOSTNAME_ADMIN
              Value: !Sub "${PrivateHostName}"
            - Name: KC_PROXY_HEADERS
              Value: xforwarded
            - Name: KC_HTTP_ENABLED
              Value: true
            - Name: KC_LOG_LEVEL
              # TODO: ensure the DEBG is not harming ur or delete it before going live
              Value: INFO,org.keycloak.events:DEBUG
            - Name: KC_HEALTH_ENABLED
              Value: true
            - Name: KC_DB
              Value: postgres
            - Name: KC_DB_SCHEMA
              Value: keycloak
            - Name: KC_DB_URL
              Value: jdbc:postgresql://iam-keycloak.cluster-chyozymq8sle.eu-west-1.rds.amazonaws.com:5432/keycloak
          Secrets:
            - Name: KEYCLOAK_ADMIN
              ValueFrom: !Join [ ':', [ !Ref KeycloakAdminUserSecrets, 'username::' ]]
            - Name: KEYCLOAK_ADMIN_PASSWORD
              ValueFrom: !Join [ ':', [ !Ref KeycloakAdminUserSecrets, 'password::' ]]
            - Name: KC_DB_USERNAME
              ValueFrom: !Join [ ':', [ !Ref KeycloakDatabaseUserSecrets, 'username::' ]]
            - Name: KC_DB_PASSWORD
              ValueFrom: !Join [ ':', [ !Ref KeycloakDatabaseUserSecrets, 'password::' ]]
          Cpu: !FindInMap [ Task, Cpu, !Ref Environment ]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/boundary/wallapop-boundaries
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref TaskPolicy
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ServiceName}-task-policy"
      Description: !Sub "Task policy for ${ServiceName} task role"
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - secretsmanager:GetSecretValue
            Effect: Allow
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${Environment}/${Project}/*"
          - Action:
              - kms:Decrypt
            Effect: Allow
            Resource: '*'

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - ListenerHTTPS
      - PublicListenerHTTPS
    Properties:
      Cluster: !Ref Environment
      ServiceName: !Ref ServiceName
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !FindInMap [ Task, DesiredCapacity, !Ref Environment ]
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets:
            - Fn::ImportValue: !Sub "${Environment}-private-subnet-a"
            - Fn::ImportValue: !Sub "${Environment}-private-subnet-b"
            - Fn::ImportValue: !Sub "${Environment}-private-subnet-c"
      LoadBalancers:
        - ContainerName: !Ref ServiceName
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
        - ContainerName: !Ref ServiceName
          ContainerPort: 8080
          TargetGroupArn: !Ref PublicTargetGroup
      PropagateTags: TASK_DEFINITION

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ServiceName}-service-security-group"
      GroupDescription: !Ref ServiceName
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-vpc"
      SecurityGroupIngress:
        - FromPort: 8080
          IpProtocol: tcp
          SourceSecurityGroupId:
            Fn::ImportValue:
              !Sub ecs-${Environment}-clusterALB-SG
          ToPort: 8080
          Description: 'Allow access from ALB'
        - FromPort: 8080
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref PublicLoadBalancerSecurityGroup
          ToPort: 8080
          Description: 'Allow access from public Security Group'

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref ServiceName
      Scheme: internal
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "true"
      SecurityGroups:
        - Fn::ImportValue:
            !Sub "ecs-${Environment}-clusterALB-SG"
      Subnets:
        - Fn::ImportValue:
            !Sub "${Environment}-private-subnet-a"
        - Fn::ImportValue:
            !Sub "${Environment}-private-subnet-b"
        - Fn::ImportValue:
            !Sub "${Environment}-private-subnet-c"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: LoadBalancer
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub "${Environment}-vpc"
      Port: 8080
      Protocol: HTTP
      Matcher:
        HttpCode: '200-299'
      HealthCheckPort: '8080'
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: '/health'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 10
      TargetType: ip
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
        - Key: slow_start.duration_seconds
          Value: '60'

  ListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ArnCertificate

  DnsAlias:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub "${Environment}-public-hosted-zone"
      RecordSets:
        - Name: !Sub "${PrivateHostName}."
          Type: A
          AliasTarget:
            HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
            DNSName: !GetAtt LoadBalancer.DNSName

  PublicLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ServiceName}-public-alb-security-group"
      GroupDescription: !Sub "Security group for ${ServiceName} public ALB"
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-vpc"
      SecurityGroupIngress:
        - FromPort: 443
          IpProtocol: tcp
          CidrIp: 54.73.44.58/32
          ToPort: 443
          Description: Allows access from VPN public IP
        - FromPort: 443
          IpProtocol: tcp
          CidrIp: 52.18.252.164/32
          ToPort: 443
          Description: Allows access from VPN public IP

  PublicLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ServiceName}-public-alb"
      Scheme: internet-facing
      SecurityGroups:
        - !Ref PublicLoadBalancerSecurityGroup
      Subnets:
        - Fn::ImportValue:
            !Sub "${Environment}-public-subnet-a"
        - Fn::ImportValue:
            !Sub "${Environment}-public-subnet-b"
        - Fn::ImportValue:
            !Sub "${Environment}-public-subnet-c"

  PublicTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: PublicLoadBalancer
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub "${Environment}-vpc"
      Port: 8080
      Protocol: HTTP
      Matcher:
        HttpCode: '200-299'
      HealthCheckPort: '8080'
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: '/health'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 10
      TargetType: ip
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
        - Key: slow_start.duration_seconds
          Value: '60'

  PublicListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            MessageBody: Forbidden
            StatusCode: 403
      LoadBalancerArn: !Ref PublicLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ArnCertificate

  PublicListenerHTTPSRules:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Priority: 1
      Actions:
        - Type: forward
          TargetGroupArn: !Ref PublicTargetGroup
      Conditions:
        - Field: path-pattern
          Values:
            - "/realms/*"
            - "/resources/*"
      ListenerArn: !Ref PublicListenerHTTPS

  PublicDnsAlias:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub "${Environment}-public-hosted-zone"
      RecordSets:
        - Name: !Sub "${PublicHostName}."
          Type: A
          AliasTarget:
            HostedZoneId: !GetAtt PublicLoadBalancer.CanonicalHostedZoneID
            DNSName: !GetAtt PublicLoadBalancer.DNSName

  KeycloakDatabaseSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ServiceName}-database-security-group-${Environment}"
      SourceSecurityGroupId: !Ref SecurityGroup
      FromPort: 5432
      ToPort: 5432
      IpProtocol: tcp
      Description: Allows Keycloak service to access the database
