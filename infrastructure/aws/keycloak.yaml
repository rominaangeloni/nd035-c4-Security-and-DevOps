Description: "Keycloak service"

Parameters:
  Project:
    Type: String
    Default: iam
    AllowedValues: [iam]
  Environment:
    Type: String
    Default: beta
    AllowedValues: [beta, prod]
  PrivateHostName:
    Type: String
  PublicHostName:
    Type: String
  ServiceName:
    Type: String
    Default: iam-keycloak
    AllowedValues: [iam-keycloak]
  EcrUri:
    Type: String
    Default: "567828013335.dkr.ecr.eu-west-1.amazonaws.com"
  DockerImageUri:
    Type: String
  ClusterPartition:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: ECS cluster partition where this service will run
  ArnCertificate:
    Type: String
  KeycloakDbUrl:
    Type: String
  MonolithDbUrl:
    Type: String
  AuthDbUrl:
    Type: String
  InfinispanS3DiscoveryBucketName:
    Type: String
    Default: keycloak-infinispan-discovery

Mappings:
  Task:
    Memory:
      prod: 4096
      beta: 2048
    Cpu:
      prod: 1024
      beta: 1024
    DesiredCapacity:
      prod: 3
      beta: 1
    MinCapacity:
      prod: 3
      beta: 1
    MaxCapacity:
      prod: 4
      beta: 1
    MinimumHealthyPercent:
      prod: 100
      beta: 100
    MaximumPercent:
      prod: 134
      beta: 200
    

Conditions:
  IsProdEnvironment: !Equals [ !Ref Environment, 'prod']
  DisableMaxTasksReachedAlarm:
    Fn::And:
      - !Condition IsProdEnvironment
      - !Not [ !Equals [!FindInMap [ Task, DesiredCapacity, !Ref Environment ], 1] ]

Resources:
  KeycloakAdminUserSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/${ServiceName}/admin"
      Description: Secrets for the Keycloak service
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakSellersXpDatabaseUserSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/rds/${ServiceName}/sellers-xp"
      Description: Secrets for sellers-xp user in Keycloak Database
      GenerateSecretString:
        SecretStringTemplate: '{"username": "sellers_xp"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakDatabaseUserSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/rds/${ServiceName}"
      Description: Secrets for the Keycloak service
      GenerateSecretString:
        SecretStringTemplate: '{"username": "keycloak"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakAuthDatabaseUserSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/rds/auth/${ServiceName}"
      Description: Secrets for Auth RDS Keycloak credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username": "keycloak"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakMonolithDbSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/rds/monolith/${ServiceName}"
      Description: Secrets for the Keycloak service's credentials to connect to Monolith's DB
      GenerateSecretString:
        SecretStringTemplate: '{"username": "keycloak"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'

  KeycloakPortalHeroClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/${ServiceName}/client/portal-hero"
      Description: Secrets for the Keycloak's portal-hero secrets
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "secret"
        PasswordLength: 32
        ExcludePunctuation: true

  KeycloakGeekMarketClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/${ServiceName}/client/geek-market"
      Description: Secrets for the Keycloak's geek-market secrets
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "secret"
        PasswordLength: 32
        ExcludePunctuation: true

  KeycloakInventarioProClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/${ServiceName}/client/inventario-pro"
      Description: Secrets for the Keycloak's inventario-pro secrets
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "secret"
        PasswordLength: 32
        ExcludePunctuation: true

  KeycloakIwakyProClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/${ServiceName}/client/iwaky"
      Description: Secrets for the Keycloak's Iwaky secrets
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "secret"
        PasswordLength: 32
        ExcludePunctuation: true

  KeycloakMotorflashProClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/${Project}/${ServiceName}/client/motorflash"
      Description: Secrets for the Keycloak's Motorflash secrets
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "secret"
        PasswordLength: 32
        ExcludePunctuation: true

  InfinispanS3DiscoveryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${InfinispanS3DiscoveryBucketName}-${Environment}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - KeycloakAdminUserSecrets
      - KeycloakDatabaseUserSecrets
    Properties:
      Family: !Ref ServiceName
      Memory: !FindInMap [ Task, Memory, !Ref Environment ]
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt TaskRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "attribute:cluster-partition == ${ClusterPartition}"
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Ref DockerImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
            - ContainerPort: 9000
          Environment:
            # HTTP
            - Name: KC_HTTP_PORT
              Value: 8080
            - Name: KC_HOSTNAME
              Value: !Sub "https://${PublicHostName}"
            - Name: KC_HOSTNAME_ADMIN
              Value: !Sub "https://${PrivateHostName}"
            - Name: KC_PROXY_HEADERS
              Value: xforwarded
            - Name: KC_HTTP_ENABLED
              Value: true
            # Logging
            - Name: KC_LOG
              Value: console,file
            - Name: KC_LOG_LEVEL
              Value: INFO,org.keycloak.events:DEBUG,org.infinispan:DEBUG,org.jgroups:DEBUG
            - Name: KC_LOG_FILE_OUTPUT
              Value: json
            # Keycloak features
            - Name: KC_FEATURES
              Value: persistent-user-sessions
            # Monitoring
            - Name: KC_HEALTH_ENABLED
              Value: true
            - Name: KC_METRICS_ENABLED
              Value: true
            # Cache
            - Name: KC_CACHE
              Value: ispn
            - Name: KC_CACHE_CONFIG_FILE
              Value: cache-ispn.xml
            - Name: JAVA_TOOL_OPTIONS
              Value: !Sub "-Djgroups.s3.region_name=${AWS::Region} -Djgroups.s3.bucket_name=${InfinispanS3DiscoveryBucketName}-${Environment}"
            # Databases
            - Name: KC_DB
              Value: postgres
            - Name: KC_DB_SCHEMA
              Value: keycloak
            - Name: KC_DB_URL
              Value: !Sub "${KeycloakDbUrl}"
            - Name: MONOLITH_DB_URL
              Value: !Sub "${MonolithDbUrl}"
            - Name: AUTH_DB_URL
              Value: !Sub "${AuthDbUrl}"
          Secrets:
            - Name: KEYCLOAK_ADMIN
              ValueFrom: !Join [ ':', [ !Ref KeycloakAdminUserSecrets, 'username::' ]]
            - Name: KEYCLOAK_ADMIN_PASSWORD
              ValueFrom: !Join [ ':', [ !Ref KeycloakAdminUserSecrets, 'password::' ]]
            - Name: KC_DB_USERNAME
              ValueFrom: !Join [ ':', [ !Ref KeycloakDatabaseUserSecrets, 'username::' ]]
            - Name: KC_DB_PASSWORD
              ValueFrom: !Join [ ':', [ !Ref KeycloakDatabaseUserSecrets, 'password::' ]]
            - Name: MONOLITH_DB_USERNAME
              ValueFrom: !Join [ ':', [ !Ref KeycloakMonolithDbSecrets, 'username::' ] ]
            - Name: MONOLITH_DB_PASSWORD
              ValueFrom: !Join [ ':', [ !Ref KeycloakMonolithDbSecrets, 'password::' ] ]
            - Name: AUTH_DB_USERNAME
              ValueFrom: !Join [ ':', [ !Ref KeycloakAuthDatabaseUserSecrets, 'username::' ] ]
            - Name: AUTH_DB_PASSWORD
              ValueFrom: !Join [ ':', [ !Ref KeycloakAuthDatabaseUserSecrets, 'password::' ] ]
            - Name: PORTAL_HERO_SECRET
              ValueFrom: !Join [ ':', [ !Ref KeycloakPortalHeroClientSecret, 'secret::' ] ]
            - Name: GEEK_MARKET_SECRET
              ValueFrom: !Join [ ':', [ !Ref KeycloakGeekMarketClientSecret, 'secret::' ] ]
            - Name: INVENTARIO_PRO_SECRET
              ValueFrom: !Join [ ':', [ !Ref KeycloakInventarioProClientSecret, 'secret::' ] ]
            - Name: IWAKY_SECRET
              ValueFrom: !Join [ ':', [ !Ref KeycloakIwakyProClientSecret, 'secret::' ] ]
            - Name: MOTORFLASH_SECRET
              ValueFrom: !Join [ ':', [ !Ref KeycloakMotorflashProClientSecret, 'secret::' ] ]
          Cpu: !FindInMap [ Task, Cpu, !Ref Environment ]
          StopTimeout: 120
        - Name: telegraf
          Image: !Sub "${EcrUri}/telegraf:1.31.1-alpine"
          Essential: false
          VolumesFrom:
            - SourceContainer: !Ref ServiceName
          Environment:
            - Name: ENV
              Value: !Ref Environment
            - Name: KEYCLOAK_HOST
              Value: localhost
        - Name: tdagent
          Image: fluent/fluentd:v0.12
          Essential: false
          VolumesFrom:
            - SourceContainer: !Ref ServiceName
          Environment:
            - Name: ENV
              Value: !Ref Environment

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/boundary/wallapop-boundaries
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref TaskPolicy
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ServiceName}-task-policy"
      Description: !Sub "Task policy for ${ServiceName} task role"
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - secretsmanager:GetSecretValue
            Effect: Allow
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${Environment}/${Project}/*"
          - Action:
              - kms:Decrypt
            Effect: Allow
            Resource: '*'
          - Action: '*'
            Effect: Allow
            Resource:
              - !GetAtt InfinispanS3DiscoveryBucket.Arn
              - !Join [ '', [ !GetAtt InfinispanS3DiscoveryBucket.Arn, '/*' ] ]

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - ListenerHTTPS
      - PublicListenerHTTPS
    Properties:
      Cluster: !Ref Environment
      ServiceName: !Ref ServiceName
      DeploymentConfiguration:
        MinimumHealthyPercent: !FindInMap [ Task, MinimumHealthyPercent, !Ref Environment ]
        MaximumPercent: !FindInMap [ Task, MaximumPercent, !Ref Environment ]
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !FindInMap [ Task, DesiredCapacity, !Ref Environment ]
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets:
            - Fn::ImportValue: !Sub "${Environment}-private-subnet-a"
            - Fn::ImportValue: !Sub "${Environment}-private-subnet-b"
            - Fn::ImportValue: !Sub "${Environment}-private-subnet-c"
      LoadBalancers:
        - ContainerName: !Ref ServiceName
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
        - ContainerName: !Ref ServiceName
          ContainerPort: 8080
          TargetGroupArn: !Ref PublicTargetGroup
      PropagateTags: TASK_DEFINITION

  MemorySoftAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      AlarmName: !Sub "${ServiceName}_memory-usage-too-high-soft"
      AlarmDescription: !Sub "Memory usage too high in ${ServiceName} (Soft)"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 3
      Metrics:
        - Id: percentage
          Label: "Memory Utilized percentage"
          Expression: "usage * 100 / reserved"
        - Id: usage
          Label: "MemoryUtilized"
          MetricStat:
            Metric:
              Dimensions:
                - Name: ClusterName
                  Value: !Ref Environment
                - Name: ServiceName
                  Value: !GetAtt Service.Name
              MetricName: MemoryUtilized
              Namespace: ECS/ContainerInsights
            Period: 600
            Stat: p90
          ReturnData: False
        - Id: reserved
          Label: "MemoryReserved"
          MetricStat:
            Metric:
              Dimensions:
                - Name: ClusterName
                  Value: !Ref Environment
                - Name: ServiceName
                  Value: !GetAtt Service.Name
              MetricName: MemoryReserved
              Namespace: ECS/ContainerInsights
            Period: 600
            Stat: Maximum
          ReturnData: False
      Threshold: 85
      TreatMissingData: missing

  MemoryHardAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-hard-alarms-topic"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-hard-alarms-topic"
      AlarmName: !Sub "${ServiceName}_memory-usage-too-high-hard"
      AlarmDescription: !Sub "Memory usage too high in ${ServiceName} (Hard)"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 6
      Metrics:
        - Id: percentage
          Label: "Memory Utilized percentage"
          Expression: "usage * 100 / reserved"
        - Id: usage
          Label: "MemoryUtilized"
          MetricStat:
            Metric:
              Dimensions:
                - Name: ClusterName
                  Value: !Ref Environment
                - Name: ServiceName
                  Value: !GetAtt Service.Name
              MetricName: MemoryUtilized
              Namespace: ECS/ContainerInsights
            Period: 600
            Stat: p90
          ReturnData: False
        - Id: reserved
          Label: "MemoryReserved"
          MetricStat:
            Metric:
              Dimensions:
                - Name: ClusterName
                  Value: !Ref Environment
                - Name: ServiceName
                  Value: !GetAtt Service.Name
              MetricName: MemoryReserved
              Namespace: ECS/ContainerInsights
            Period: 600
            Stat: Maximum
          ReturnData: False
      Threshold: 95
      TreatMissingData: missing

  CpuSoftAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      AlarmName: !Sub "${ServiceName}_cpu-usage-too-high-soft"
      AlarmDescription: !Sub "CPU usage too high in ${ServiceName} (Soft)"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 3
      Metrics:
        - Id: percentage
          Label: "CPU Utilized percentage"
          Expression: "usage * 100 / reserved"
        - Id: usage
          Label: "CPUUtilized"
          MetricStat:
            Metric:
              Dimensions:
                - Name: ClusterName
                  Value: !Ref Environment
                - Name: ServiceName
                  Value: !GetAtt Service.Name
              MetricName: CpuUtilized
              Namespace: ECS/ContainerInsights
            Period: 600
            Stat: p90
          ReturnData: False
        - Id: reserved
          Label: "CPUReserved"
          MetricStat:
            Metric:
              Dimensions:
                - Name: ClusterName
                  Value: !Ref Environment
                - Name: ServiceName
                  Value: !GetAtt Service.Name
              MetricName: CpuReserved
              Namespace: ECS/ContainerInsights
            Period: 600
            Stat: Maximum
          ReturnData: False
      Threshold: 85
      TreatMissingData: missing

  CpuHardAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-hard-alarms-topic"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-hard-alarms-topic"
      AlarmName: !Sub "${ServiceName}_cpu-usage-too-high-hard"
      AlarmDescription: !Sub "CPU usage too high in ${ServiceName} (Hard)"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 6
      Metrics:
        - Id: percentage
          Label: "CPU Utilized percentage"
          Expression: "usage * 100 / reserved"
        - Id: usage
          Label: "CPUUtilized"
          MetricStat:
            Metric:
              Dimensions:
                - Name: ClusterName
                  Value: !Ref Environment
                - Name: ServiceName
                  Value: !GetAtt Service.Name
              MetricName: CpuUtilized
              Namespace: ECS/ContainerInsights
            Period: 600
            Stat: p90
          ReturnData: False
        - Id: reserved
          Label: "CPUReserved"
          MetricStat:
            Metric:
              Dimensions:
                - Name: ClusterName
                  Value: !Ref Environment
                - Name: ServiceName
                  Value: !GetAtt Service.Name
              MetricName: CpuReserved
              Namespace: ECS/ContainerInsights
            Period: 600
            Stat: Maximum
          ReturnData: False
      Threshold: 95
      TreatMissingData: missing

  MinRunningTasksSoftAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      AlarmName: !Sub "${ServiceName}_running-tasks-below-minimum-soft"
      AlarmDescription: !Sub "Running task count is below minimum in ${ServiceName} (Soft)"
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: ClusterName
          Value: !Ref Environment
        - Name: ServiceName
          Value: !GetAtt Service.Name
      EvaluationPeriods: 2
      MetricName: RunningTaskCount
      Namespace: ECS/ContainerInsights
      Period: 60
      Statistic: Minimum
      Threshold: !FindInMap [ Task, MinCapacity, !Ref Environment ]
      TreatMissingData: missing

  MaxRunningTasksSoftAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DisableMaxTasksReachedAlarm
    Properties:
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      AlarmName: !Sub "${ServiceName}_running-tasks-reached-maximum-soft"
      AlarmDescription: !Sub "Running task count reached the maximum configured in ${ServiceName} (Soft)"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ClusterName
          Value: !Ref Environment
        - Name: ServiceName
          Value: !GetAtt Service.Name
      EvaluationPeriods: 15
      MetricName: RunningTaskCount
      Namespace: ECS/ContainerInsights
      Period: 60
      Statistic: Maximum
      Threshold: !FindInMap [ Task, MaxCapacity, !Ref Environment ]
      TreatMissingData: missing

  MinRunningTasksHardAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-hard-alarms-topic"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-hard-alarms-topic"
      AlarmName: !Sub "${ServiceName}_running-tasks-below-minimum-hard"
      AlarmDescription: !Sub "Running task count is below minimum in ${ServiceName} (Hard)"
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: ClusterName
          Value: !Ref Environment
        - Name: ServiceName
          Value: !GetAtt Service.Name
      EvaluationPeriods: 6
      MetricName: RunningTaskCount
      Namespace: ECS/ContainerInsights
      Period: 60
      Statistic: Minimum
      Threshold: !FindInMap [ Task, MinCapacity, !Ref Environment ]
      TreatMissingData: missing

  AutoScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: CPUAutoScalingPolicy
      ScalingTargetId: !Ref AutoScalingTarget
      PolicyType: TargetTrackingScaling
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 80.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 30
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  AutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !FindInMap [ Task, MaxCapacity, !Ref Environment ]
      MinCapacity: !FindInMap [ Task, MinCapacity, !Ref Environment ]
      ResourceId: !Sub "service/${Environment}/${Service.Name}"
      RoleARN:
        Fn::ImportValue: run-autoscaling-role
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ServiceName}-service-security-group"
      GroupDescription: !Ref ServiceName
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-vpc"
      SecurityGroupIngress:
        - FromPort: 8080
          IpProtocol: tcp
          SourceSecurityGroupId:
            Fn::ImportValue:
              !Sub ecs-${Environment}-clusterALB-SG
          ToPort: 8080
          Description: 'Allow access from ALB'
        - FromPort: 9000
          IpProtocol: tcp
          SourceSecurityGroupId:
            Fn::ImportValue:
              !Sub ecs-${Environment}-clusterALB-SG
          ToPort: 9000
          Description: 'Allow access from ALB to healthcheck port'
        - FromPort: 8080
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref PublicLoadBalancerSecurityGroup
          ToPort: 8080
          Description: 'Allow access from public Security Group'
        - FromPort: 9000
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref PublicLoadBalancerSecurityGroup
          ToPort: 9000
          Description: 'Allow access from public Security Group to healthcheck port'

  KeycloakSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroup
      SourceSecurityGroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 7800
      ToPort: 7800
      Description: "Allow embedded Infinispan cache nodes to communicate with each other"

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref ServiceName
      Scheme: internal
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "true"
      SecurityGroups:
        - Fn::ImportValue:
            !Sub "ecs-${Environment}-clusterALB-SG"
      Subnets:
        - Fn::ImportValue:
            !Sub "${Environment}-private-subnet-a"
        - Fn::ImportValue:
            !Sub "${Environment}-private-subnet-b"
        - Fn::ImportValue:
            !Sub "${Environment}-private-subnet-c"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: LoadBalancer
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub "${Environment}-vpc"
      Port: 8080
      Protocol: HTTP
      Matcher:
        HttpCode: '200-299'
      HealthCheckPort: '9000'
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: '/health'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 10
      TargetType: ip
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
        - Key: slow_start.duration_seconds
          Value: '60'

  ListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ArnCertificate

  DnsAlias:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub "${Environment}-public-hosted-zone"
      RecordSets:
        - Name: !Sub "${PrivateHostName}."
          Type: A
          AliasTarget:
            HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
            DNSName: !GetAtt LoadBalancer.DNSName

  PublicLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ServiceName}-public-alb-security-group"
      GroupDescription: !Sub "Security group for ${ServiceName} public ALB"
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-vpc"
      SecurityGroupIngress:
        - FromPort: 443
          IpProtocol: tcp
          CidrIp: 0.0.0.0/0
          ToPort: 443
          Description: Allows all traffic from internet

  PublicLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ServiceName}-public-alb"
      Scheme: internet-facing
      SecurityGroups:
        - !Ref PublicLoadBalancerSecurityGroup
      Subnets:
        - Fn::ImportValue:
            !Sub "${Environment}-public-subnet-a"
        - Fn::ImportValue:
            !Sub "${Environment}-public-subnet-b"
        - Fn::ImportValue:
            !Sub "${Environment}-public-subnet-c"

  PublicTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: PublicLoadBalancer
    Properties:
      VpcId:
        Fn::ImportValue:
          !Sub "${Environment}-vpc"
      Port: 8080
      Protocol: HTTP
      Matcher:
        HttpCode: '200-299'
      HealthCheckPort: '9000'
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: '/health'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 10
      TargetType: ip
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '60'
        - Key: slow_start.duration_seconds
          Value: '60'

  PublicListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            MessageBody: Forbidden
            StatusCode: 403
      LoadBalancerArn: !Ref PublicLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ArnCertificate

  PublicListenerHTTPSRules:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Priority: 1
      Actions:
        - Type: forward
          TargetGroupArn: !Ref PublicTargetGroup
      Conditions:
        - Field: path-pattern
          Values:
            - "/realms/*"
            - "/resources/*"
      ListenerArn: !Ref PublicListenerHTTPS

  PublicDnsAlias:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub "${Environment}-public-hosted-zone"
      RecordSets:
        - Name: !Sub "${PublicHostName}."
          Type: A
          AliasTarget:
            HostedZoneId: !GetAtt PublicLoadBalancer.CanonicalHostedZoneID
            DNSName: !GetAtt PublicLoadBalancer.DNSName

  PublicAlbLatencySoftAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      AlarmName: !Sub "${ServiceName}-api_latency-too-high-soft"
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      ExtendedStatistic: p90
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      Period: 600
      EvaluationPeriods: 3
      TreatMissingData: "notBreaching"
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName

  PublicAlbUnhealthyHostSoftAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      AlarmName: !Sub "${ServiceName}-api_unhealthy-hosts-too-high-soft"
      AlarmDescription: !Sub "Unhealthy host count is above threshold in ${Project}-api (Soft)"
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt PublicTargetGroup.TargetGroupFullName
      EvaluationPeriods: 2
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      Period: 60
      Statistic: Maximum
      Threshold: 0
      TreatMissingData: missing

  PublicAlbUnhealthyHostHardAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-hard-alarms-topic"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-hard-alarms-topic"
      AlarmName: !Sub "${ServiceName}-api_unhealthy-hosts-too-high-hard"
      AlarmDescription: !Sub "Unhealthy host count is above threshold in ${Project}-api (Hard)"
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt PublicTargetGroup.TargetGroupFullName
      EvaluationPeriods: 10
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      Period: 60
      Statistic: Maximum
      Threshold: 0
      TreatMissingData: missing

  PublicAlb5XXRatioSoftAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      ActionsEnabled: Yes
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      AlarmDescription: !Sub "HTTP 5XX Ratio too high in ${Project} (Soft)"
      AlarmName: !Sub "${ServiceName}-api_5xx-too-high-soft"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 3
      Metrics:
        - Id: ratio
          Label: "5XX percentage"
          Expression: "(target5xxcount + elb5xxcount) * 100 / requestcount"
        - Id: target5xxcount
          Label: "HTTPCode_Target_5XX_Count"
          MetricStat:
            Metric:
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
              MetricName: HTTPCode_Target_5XX_Count
              Namespace: AWS/ApplicationELB
            Period: 60
            Stat: Sum
          ReturnData: False
        - Id: elb5xxcount
          Label: "HTTPCode_ELB_5XX_Count"
          MetricStat:
            Metric:
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
              MetricName: HTTPCode_ELB_5XX_Count
              Namespace: AWS/ApplicationELB
            Period: 60
            Stat: Sum
          ReturnData: False
        - Id: requestcount
          Label: "RequestCount"
          MetricStat:
            Metric:
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
              MetricName: RequestCount
              Namespace: AWS/ApplicationELB
            Period: 60
            Stat: Sum
          ReturnData: False
      Threshold: 1.0
      TreatMissingData: "notBreaching"

  PublicAlb5XXRatioHardAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      ActionsEnabled: Yes
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-hard-alarms-topic"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-hard-alarms-topic"
      AlarmDescription: !Sub "HTTP 5XX Ratio too high in ${Project} (Hard)"
      AlarmName: !Sub "${ServiceName}-api_5xx-too-high-hard"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      Metrics:
        - Id: ratio
          Label: "5XX percentage"
          Expression: "(target5xxcount + elb5xxcount) * 100 / requestcount"
        - Id: target5xxcount
          Label: "HTTPCode_Target_5XX_Count"
          MetricStat:
            Metric:
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
              MetricName: HTTPCode_Target_5XX_Count
              Namespace: AWS/ApplicationELB
            Period: 900
            Stat: Sum
          ReturnData: False
        - Id: elb5xxcount
          Label: "HTTPCode_ELB_5XX_Count"
          MetricStat:
            Metric:
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
              MetricName: HTTPCode_ELB_5XX_Count
              Namespace: AWS/ApplicationELB
            Period: 900
            Stat: Sum
          ReturnData: False
        - Id: requestcount
          Label: "RequestCount"
          MetricStat:
            Metric:
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
              MetricName: RequestCount
              Namespace: AWS/ApplicationELB
            Period: 900
            Stat: Sum
          ReturnData: False
      Threshold: 50.0
      TreatMissingData: "notBreaching"

  PublicAlb3XXRatioSoftAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProdEnvironment
    Properties:
      ActionsEnabled: Yes
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      OKActions:
        - Fn::ImportValue: !Sub "${Project}-soft-alarms-topic-arn-${Environment}"
      AlarmDescription: !Sub "HTTP 3XX Ratio too high in ${Project} sign-in is probably broken caused by Infinispan inconsistent state (Soft)"
      AlarmName: !Sub "${ServiceName}-api_3xx-too-high-soft"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      Metrics:
        - Id: ratio
          Label: "3XX percentage"
          Expression: "(target3xxcount) * 100 / requestcount"
        - Id: target3xxcount
          Label: "HTTPCode_Target_3XX_Count"
          MetricStat:
            Metric:
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
              MetricName: HTTPCode_Target_3XX_Count
              Namespace: AWS/ApplicationELB
            Period: 300
            Stat: Sum
          ReturnData: False
        - Id: requestcount
          Label: "RequestCount"
          MetricStat:
            Metric:
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt PublicLoadBalancer.LoadBalancerFullName
              MetricName: RequestCount
              Namespace: AWS/ApplicationELB
            Period: 300
            Stat: Sum
          ReturnData: False
      Threshold: 80.0
      TreatMissingData: "notBreaching"

  KeycloakDatabaseSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ServiceName}-database-security-group-${Environment}"
      SourceSecurityGroupId: !Ref SecurityGroup
      FromPort: 5432
      ToPort: 5432
      IpProtocol: tcp
      Description: Allows Keycloak service to access the database

  MonolithDatabaseSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${Environment}-monolith-sg"
      SourceSecurityGroupId: !Ref SecurityGroup
      FromPort: 3306
      ToPort: 3306
      IpProtocol: tcp
      Description: !Sub "Allow access from ${ServiceName}"

  AuthDatabaseSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "Auth-${Environment}-RDS-sg"
      SourceSecurityGroupId: !Ref SecurityGroup
      FromPort: 3306
      ToPort: 3306
      IpProtocol: tcp
      Description: !Sub "Allow access from ${ServiceName}"

Outputs:
  PublicLoadBalancerArn:
    Description: Keycloak public load balancer
    Value: !Ref PublicLoadBalancer
    Export:
      Name: !Sub "${ServiceName}-public-load-balancer-${Environment}"
