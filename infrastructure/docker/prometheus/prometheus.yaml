global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 1m

remote_write:
  - url: https://prometheus-us-central1.grafana.net/api/prom/push
    basic_auth:
      username: PROMETHEUS_USERNAME
      password: PROMETHEUS_PASSWORD

scrape_configs:
  - job_name: keycloak-JOB_NAME_SUFFIX
    static_configs:
      - targets: ['localhost:9000']
        labels:
          task_id: TASK_ID
