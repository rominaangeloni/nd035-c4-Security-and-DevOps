<source>
  type tail
  format json
  path /opt/keycloak/data/log/keycloak.log
  pos_file /tmp/keycloak.log.pos
  time_key @timestamp
  time_format %FT%T.%NZ
  tag iam.keycloak.application
</source>

<filter **>
  @type record_transformer
  enable_ruby true
  <record>
    exceptionFrames ${record['exception'] ? record['exception']['frames'] ? record['exception']['frames'].map{|frame| "#{frame['class']}.#{frame['method']}(#{frame['line']})" }.join("\n") : nil : nil}
    exceptionMessage ${record['exception'] ? record['exception']['message'] : nil}
    exceptionClass ${record['exception'] ? record['exception']['exceptionType'] : nil}
    task_id "<TASK_ID>"
  </record>
  remove_keys exception
</filter>

<match **>
  type forward
  send_timeout 60s
  recover_wait 10s
  heartbeat_interval 1s
  phi_threshold 16
  hard_timeout 60s
  <server>
    host "logging-platform-collector.wallapop.#{ENV['ENV']}"
    port 24224
  </server>
</match>
